name: flutterpatch
description: >
  Umbrella client for Meta OTA — resource hot-update + Shorebird code push
  behind one init/wrap/sync API.
version: 0.1.0
homepage: https://github.com/josercc/flutterpatch_downloader
repository: https://github.com/josercc/flutterpatch_downloader

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  hot_asset_gen: ^0.1.0
  http: ^1.2.2
  ota_protocol: ^0.1.0
  package_info_plus: ^8.3.0
  shorebird_code_push: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
